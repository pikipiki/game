sonar.projectKey=royaumes-des-peluches
sonar.projectName=Royaumes des Peluches

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx,tests/**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,tests/**

sonar.typescript.tsconfigPaths=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.node.maxspace=4096

# Three.js render layers: voluminous, peu testés en unitaire (voir vite coverage exclude).
sonar.coverage.exclusions=src/main.tsx,src/app/**,src/render/**

# Helpers mesh 3D : nombreux paramètres géométriques, refactor non prioritaire.
sonar.issue.ignore.multicriteria=town-mesh-params
sonar.issue.ignore.multicriteria.town-mesh-params.ruleKey=typescript:S107
sonar.issue.ignore.multicriteria.town-mesh-params.resourceKey=src/render/town.ts
